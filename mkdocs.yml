    - Sync - pull: runbooks/sync/pull.md
    - Sync - folder preservation: runbooks/sync/folder-preservation.md
    - Sync - snapshot freshness: runbooks/sync/snapshot-freshness.md
    - Scheduled drift detection: runbooks/drift-detection/scheduled-drift.md
    - Deploy with tests: runbooks/pipeline-orchestration/deploy-with-tests.md
    - Work-item comment rendering: runbooks/work-item-traceability/comment-rendering.md
  - Decisions (ADRs):
    - ADR-0004 API version policy: decisions/ADR-0004-api-version-policy.md
    - ADR-0010 Commercial model: decisions/ADR-0010-commercial-model.md
    - ADR-0011 Rename to Sigantry: decisions/ADR-0011-rename-to-sigantry.md
    - ADR-0012 sync apply vs deploy run: decisions/ADR-0012-sync-apply-vs-deploy-run-boundary.md
    - ADR-0013 sync publish parameters: decisions/ADR-0013-sync-publish-parameters-resolution.md
    - ADR-0014 Plugin trust model: decisions/ADR-0014-plugin-trust-model.md
    - ADR-0015 Config-driven preflight: decisions/ADR-0015-config-driven-preflight.md
    - ADR-0016 Plugin scope & parity: decisions/ADR-0016-plugin-scope-and-parity-model.md
