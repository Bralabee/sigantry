    - 04 Audit trail: tutorials/04-audit-trail.md
    - 05 Adopt existing workspace: tutorials/05-adopt-existing-workspace.md
    - 06 Bootstrap workspace: tutorials/06-bootstrap-workspace.md
    - 07 Rollback: tutorials/07-rollback.md
    - 08 Scheduled drift alerts: tutorials/08-scheduled-drift-alerts.md
    - 09 PR review bot: tutorials/09-pr-review-bot.md
    - 10 Governance: tutorials/10-governance.md
    - 11 Environments & libraries: tutorials/11-environments-and-libraries.md
    - 12 Config-driven auto-update: tutorials/12-config-driven-autoupdate.md
  - Demo:
