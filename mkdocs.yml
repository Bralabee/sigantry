site_name: Sigantry
site_description: Enterprise-grade Git-centric Fabric DataOps CLI, SDK, and Governance Platform.
site_url: https://github.com/Bralabee/sigantry
repo_url: https://github.com/Bralabee/sigantry
repo_name: Bralabee/sigantry
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default

