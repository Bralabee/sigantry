# templates/jobs/lint-python.yml
# ------------------------------------------------------------------
# ruff check + ruff format --check + mypy (job template).
#
# Sources (Pitfall 14 / Phase 5 Success Criterion 1):
#   Microsoft Learn - Job templates
#     https://learn.microsoft.com/azure/devops/pipelines/process/templates
#     ms.date: 2026-04-20
#   Microsoft Learn - steps.script
#     https://learn.microsoft.com/azure/devops/pipelines/yaml-schema/steps-script
#
# ONE COMMAND PER `script:` STEP (#22). A `script:` step runs its body
# under bash WITHOUT errexit on Linux (cmd.exe on Windows) and fails only
# on the exit status of the LAST command, so in a two-line body a failing
# first command is hidden by a passing second one: `ruff check` reporting
# errors and `ruff format --check` passing gave a green step. With a single
# command, the step's status is that command's status under any shell. Do
# not add a second command to a step; give it a step of its own.
#
# Every step runs on the adopter's tree, so none may call a file only this
# repo has. The dual-CI parity lint and the docs-freshness gate are this
# repo's own checks: they run in its GitHub CI and are not shipped here.
# ------------------------------------------------------------------

parameters:
  - name: pythonVersion
    type: string
    default: '3.11'
  - name: sourcePaths
    type: string
    default: 'sigantry_core/ tests/ scripts/'
  - name: enableTypeCheck
    type: boolean
    # Consumers without mypy in their dev extra, or without a scripts/ dir,
    # can turn the step off rather than having it appear under them.
    default: true
  - name: typeCheckPaths
    type: string
    # `tests/` is absent deliberately: mypy aborts there in module
    # resolution (duplicate basenames, no __init__.py) before checking starts.
    default: 'sigantry_core/ scripts/'

jobs:
  - job: python_lint
    displayName: 'Python lint (ruff)'
    steps:
      - task: UsePythonVersion@0
        displayName: 'Use Python ${{ parameters.pythonVersion }}'
        inputs:
          versionSpec: ${{ parameters.pythonVersion }}
          addToPath: true
      - script: python -m pip install --upgrade pip
        displayName: 'Upgrade pip'
      - script: pip install -e ".[dev]"
        displayName: 'Install Python deps'
      # Separate steps, as in .github/workflows/ci.yml's `lint` job.
      - script: ruff check ${{ parameters.sourcePaths }}
        displayName: 'Ruff check'
      - script: ruff format --check ${{ parameters.sourcePaths }}
        displayName: 'Ruff format check'
      # Parity with .github/workflows/ci.yml's `Type Check (mypy)` job, which
      # is a required status check on main. Without this the ADO lane and the
      # GitHub lane disagree about what the gates are -- the thing
      # docs/reference/dual-ci-strategy.md exists to prevent.
      - ${{ if eq(parameters.enableTypeCheck, true) }}:
          - script: mypy ${{ parameters.typeCheckPaths }}
            displayName: 'mypy'
