# Sigantry demo -- parameters.yml
# ------------------------------
# The rules below mirror the starter's examples. The demo items carry none
# of their placeholders, so a demo deploy substitutes nothing.
#
# Byte-extension of templates/starter/parameters.yml. Only the DEV
# ENV-var refs differ -- the DEV slot reads SIGANTRY_DEMO_* variables
# (per CONTEXT.md D-06). The demo uses only the DEV slot; the
# PREPROD/PROD slots are kept for shape parity with the starter.
#
# Validate the DEV slot locally with:
#     sigantry config validate parameters.yml --environment DEV
#
# IMPORTANT: This file MUST NOT contain literal tenant IDs or
# tokens -- only $ENV:* references. Any literal value here is a
# security incident (RESEARCH §Pitfall 8).

# ----- find_replace: bulk text substitution in item bodies -----
find_replace:
  # Workspace-ID swap for every Notebook (consumed by demo CI).
  - find_value: "placeholder-workspace-id"
    item_type: Notebook
    replace_value:
      DEV:     "$ENV:SIGANTRY_DEMO_WORKSPACE_ID"
      PREPROD: "$ENV:SIGANTRY_FABRIC_WORKSPACE_ID_PREPROD"
      PROD:    "$ENV:SIGANTRY_FABRIC_WORKSPACE_ID_PROD"

# ----- key_value_replace: JSON-path substitution -----
key_value_replace:
  - find_key: "$.properties.activities[?(@.name=='Stage1')].typeProperties.url"
    replace_value:
      _ALL_: "$items.DataPipeline.Stage1.$id"

# ----- spark_pool: per-env Spark pool selection -----
spark_pool: []
