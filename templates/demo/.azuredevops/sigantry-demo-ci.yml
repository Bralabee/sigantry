# sigantry-dual-ci-exception: ci-mechanics
# Adopter-consumed file -- pairs with .github/workflows/sigantry-demo-ci.yml.
# Byte-args parity asserted by tests/ci/test_demo_dual_ci.py, not by the
# monorepo dual-CI parity registry (RESEARCH Anti-Pattern 4 + Phase 14
# pr-bot.yml precedent).
#
# The demo runs end to end on a Fabric capacity (an F SKU or a Fabric trial)
# through its GitHub Actions half; this Azure DevOps half has not been run.
#
# Demo CI ADO half (Phase 15 / DEMO-02). Runs in an ADO project you create
# from a copy of templates/demo/; the demo is not provisioned as its own
# repository. Its steps are sigantry deploy run,
# sigantry release record and sigantry diff --fail-on-drift against the
# demo tenant, with the SIGANTRY_DEMO_* secrets from the operator-managed
# `sigantry-demo-secrets` variable group.
#
# All SIGANTRY_DEMO_* references appear ONLY via $(SIGANTRY_DEMO_*);
# no literals (RESEARCH Pitfall 8). --environment DEV selects the DEV slot
# of parameters.yml, the only slot the demo uses (RESEARCH Pitfall 9).
trigger:
  branches:
    include: [main]
  paths:
    include: [fabric_items, parameters.yml]

pr:
  branches:
    include: [main]

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: sigantry-demo-secrets   # holds SIGANTRY_DEMO_*

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: 'Set up Python'
  - script: pip install sigantry
    displayName: 'Install sigantry'
  - script: |
      sigantry deploy run \
        --params parameters.yml \
        --workspace-id "$(SIGANTRY_DEMO_WORKSPACE_ID)" \
        --tenant-id "$(SIGANTRY_DEMO_TENANT_ID)" \
        --environment DEV \
        --item-types "Notebook,DataPipeline,SemanticModel" \
        --source fabric_items
    env:
      AZURE_TENANT_ID: $(SIGANTRY_DEMO_TENANT_ID)
      AZURE_CLIENT_ID: $(SIGANTRY_DEMO_CLIENT_ID)
      AZURE_CLIENT_SECRET: $(SIGANTRY_DEMO_FABRIC_TOKEN)
      SIGANTRY_DEMO_TENANT_ID: $(SIGANTRY_DEMO_TENANT_ID)
      SIGANTRY_DEMO_CAPACITY_ID: $(SIGANTRY_DEMO_CAPACITY_ID)
      SIGANTRY_DEMO_WORKSPACE_ID: $(SIGANTRY_DEMO_WORKSPACE_ID)
    displayName: 'Deploy'
  # Issue #127: fetch the ledger artifact of the latest earlier run of THIS
  # pipeline. Nothing else puts a previous run's artifact on the agent. The
  # first run has none, so the task may fail; the next step says so.
  - task: DownloadPipelineArtifact@2
    displayName: 'Download prior audit ledger'
    continueOnError: true
    inputs:
      source: specific
      project: $(System.TeamProjectId)
      pipeline: $(System.DefinitionId)
      runVersion: latest
      allowPartiallySucceededBuilds: true
      artifact: sigantry-audit-ledger
      path: $(Pipeline.Workspace)/sigantry-prior-ledger
  - script: |
      mkdir -p "$(Agent.TempDirectory)/sigantry-audit"
      if [ -s "$(Agent.TempDirectory)/sigantry-audit/deploys.jsonl" ]; then
        echo "audit ledger already present; not restoring"
      elif [ -s "$(Pipeline.Workspace)/sigantry-prior-ledger/deploys.jsonl" ]; then
        cp "$(Pipeline.Workspace)/sigantry-prior-ledger/deploys.jsonl" "$(Agent.TempDirectory)/sigantry-audit/deploys.jsonl"
        echo "restored audit ledger ($(wc -l < "$(Agent.TempDirectory)/sigantry-audit/deploys.jsonl") record(s))"
      else
        echo "##vso[task.logissue type=warning]no prior sigantry-audit-ledger artifact for this pipeline; this release starts a NEW audit ledger chain"
      fi
    displayName: 'Restore prior audit ledger (deploys.jsonl)'
  - script: |
      sigantry release record \
        --release-id "$(Build.SourceVersion)" \
        --workspace "$(SIGANTRY_DEMO_WORKSPACE_ID)" \
        --provider ado \
        --work-items "$(SIGANTRY_DEMO_WORK_ITEM_ID)" \
        --approver "$(Build.RequestedForEmail)" \
        --fabric-items "LoadOrders.Notebook,RefreshOrdersDaily.DataPipeline,OrdersAnalytics.SemanticModel" \
        --ado-organization "$(System.CollectionUri)" \
        --ado-project "$(System.TeamProject)" \
        --ado-tenant-id "$(SIGANTRY_DEMO_TENANT_ID)" \
        --audit-dir "$(Agent.TempDirectory)/sigantry-audit"
      sigantry release verify \
        --audit-dir "$(Agent.TempDirectory)/sigantry-audit"
    env:
      AZURE_TENANT_ID: $(SIGANTRY_DEMO_TENANT_ID)
      AZURE_CLIENT_ID: $(SIGANTRY_DEMO_CLIENT_ID)
      AZURE_CLIENT_SECRET: $(SIGANTRY_DEMO_FABRIC_TOKEN)
    displayName: 'Record release'
  - publish: $(Agent.TempDirectory)/sigantry-audit
    artifact: sigantry-audit-ledger
    displayName: 'Upload audit ledger artifact'
    condition: always()
  - script: |
      sigantry diff \
        --workspace-id "$(SIGANTRY_DEMO_WORKSPACE_ID)" \
        --tenant-id "$(SIGANTRY_DEMO_TENANT_ID)" \
        --manifest sync.yml \
        --fail-on-drift
    env:
      AZURE_TENANT_ID: $(SIGANTRY_DEMO_TENANT_ID)
      AZURE_CLIENT_ID: $(SIGANTRY_DEMO_CLIENT_ID)
      AZURE_CLIENT_SECRET: $(SIGANTRY_DEMO_FABRIC_TOKEN)
    displayName: 'Diff (fail on drift)'
