# sigantry-demo-ci.yml -- adopter-consumed GHA workflow (Phase 15 / DEMO-02)
# The demo does not run end to end on the shipped demo tree yet.
#
# Runs in a GitHub repo you create from a copy of templates/demo/; the demo
# is not provisioned as its own repository.
# Pair: templates/demo/.azuredevops/sigantry-demo-ci.yml. Parity asserted
# by tests/ci/test_demo_dual_ci.py.
#
# Triggers (CONTEXT D-04 + RESEARCH Pitfall 3):
#   push:         branches main, paths fabric_items/** + parameters.yml
#   pull_request: branches main (only the safe `pull_request` event;
#                 the privileged-target variant is forbidden -- it
#                 exposes secrets to fork PRs)
#
# Each secret-using step is guarded with
# `if: ${{ env.SIGANTRY_DEMO_HAS_TOKEN == 'true' }}`, for runs where the
# token secret is not set, such as fork PRs (where secrets are not
# exposed). A step `if:` cannot read `secrets`, so the job-level env
# carries only whether the token is set.
#
# All SIGANTRY_DEMO_* secrets are referenced ONLY via
# `${{ secrets.SIGANTRY_DEMO_* }}` -- no literals (RESEARCH Pitfall 8).
# `--environment DEV` selects the DEV slot of parameters.yml, the only
# slot the demo uses (RESEARCH Pitfall 9).
name: sigantry-demo-ci

on:
  push:
    branches: [main]
    paths:
      - "fabric_items/**"
      - "parameters.yml"
  pull_request:
    branches: [main]

# Default least-privilege at workflow scope; each job re-declares its own
# block so future seam-expansion jobs cannot silently inherit read-write
# (RESEARCH Pitfall 3 + Phase 14 pr-bot.yml precedent).
permissions:
  contents: read

jobs:
  deploy_record_diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      SIGANTRY_DEMO_HAS_TOKEN: ${{ secrets.SIGANTRY_DEMO_FABRIC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # No `cache: 'pip'`: setup-python's pip cache looks for a
      # requirements.txt or pyproject.toml, and the demo tree has neither.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sigantry
        run: pip install sigantry
      - name: Deploy
        if: ${{ env.SIGANTRY_DEMO_HAS_TOKEN == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.SIGANTRY_DEMO_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.SIGANTRY_DEMO_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SIGANTRY_DEMO_FABRIC_TOKEN }}
          SIGANTRY_DEMO_TENANT_ID: ${{ secrets.SIGANTRY_DEMO_TENANT_ID }}
          SIGANTRY_DEMO_CAPACITY_ID: ${{ secrets.SIGANTRY_DEMO_CAPACITY_ID }}
          SIGANTRY_DEMO_WORKSPACE_ID: ${{ secrets.SIGANTRY_DEMO_WORKSPACE_ID }}
        run: |
          sigantry deploy run \
            --params parameters.yml \
            --workspace-id "${SIGANTRY_DEMO_WORKSPACE_ID}" \
            --tenant-id "${AZURE_TENANT_ID}" \
            --environment DEV \
            --item-types "Notebook,DataPipeline,SemanticModel" \
            --source fabric_items
      - name: Record release
        if: ${{ env.SIGANTRY_DEMO_HAS_TOKEN == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGANTRY_DEMO_WORKSPACE_ID: ${{ secrets.SIGANTRY_DEMO_WORKSPACE_ID }}
          SIGANTRY_DEMO_WORK_ITEM_ID: ${{ secrets.SIGANTRY_DEMO_WORK_ITEM_ID }}
          SIGANTRY_DEMO_RELEASE_ID: ${{ github.sha }}
        run: |
          sigantry release record \
            --release-id "${SIGANTRY_DEMO_RELEASE_ID}" \
            --workspace "${SIGANTRY_DEMO_WORKSPACE_ID}" \
            --provider github \
            --work-items "${SIGANTRY_DEMO_WORK_ITEM_ID:-1}" \
            --approver "${GITHUB_ACTOR}" \
            --fabric-items "LoadOrders.Notebook,RefreshOrdersDaily.DataPipeline,OrdersAnalytics.SemanticModel" \
            --github-owner "${GITHUB_REPOSITORY_OWNER}" \
            --github-repo "${GITHUB_REPOSITORY#*/}" \
            --audit-dir "${RUNNER_TEMP}/sigantry-audit"
          sigantry release verify \
            --audit-dir "${RUNNER_TEMP}/sigantry-audit"
      - name: Diff (fail on drift)
        if: ${{ env.SIGANTRY_DEMO_HAS_TOKEN == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.SIGANTRY_DEMO_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.SIGANTRY_DEMO_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.SIGANTRY_DEMO_FABRIC_TOKEN }}
          SIGANTRY_DEMO_WORKSPACE_ID: ${{ secrets.SIGANTRY_DEMO_WORKSPACE_ID }}
        run: |
          sigantry diff \
            --workspace-id "${SIGANTRY_DEMO_WORKSPACE_ID}" \
            --tenant-id "${AZURE_TENANT_ID}" \
            --manifest sync.yml \
            --fail-on-drift
