# templates/steps/fabric-deploy.yml
# ------------------------------------------------------------------
# Step template: install `sigantry-core` from the ADO Artifacts feed
# then invoke `sigantry deploy run` under AzureCLI@2 with a
# workload-identity-federation service connection (Pitfall C - no
# `$(System.AccessToken)` needed; the SC supplies credentials).
#
# Sources (Pitfall 14 / Phase 5 Success Criterion 1):
#   Microsoft Learn - AzureCLI@2 task
#     https://learn.microsoft.com/azure/devops/pipelines/tasks/reference/azure-cli-v2
#     ms.date: 2026-04-20
#   Microsoft Learn - PipAuthenticate@1 task
#     https://learn.microsoft.com/azure/devops/pipelines/tasks/reference/pip-authenticate-v1
#     ms.date: 2026-04-20
#
# Wraps Phase 4 `sigantry deploy run` (sigantry_core/deploy/cli.py).
# ------------------------------------------------------------------

parameters:
  - name: workspaceId
    type: string
  - name: serviceConnection
    type: string
  - name: sourceDir
    type: string
  - name: parametersPath
    type: string
  - name: environment
    type: string
  - name: itemTypes
    type: string
    default: 'Lakehouse,Environment,Notebook,DataPipeline'
  - name: artifactsFeed
    type: string
    default: 'fabric-dataops-toolkits'
  - name: fabricDataopsVersion
    type: string
    default: ''
  - name: pythonVersion
    type: string
    default: '3.11'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}
      addToPath: true

  - task: PipAuthenticate@1
    displayName: 'Authenticate pip to ADO Artifacts (${{ parameters.artifactsFeed }})'
    inputs:
      artifactFeeds: ${{ parameters.artifactsFeed }}
      onlyAddExtraIndex: true

  - script: |
      set -e
      python -m pip install --upgrade pip
      if [ -n '${{ parameters.fabricDataopsVersion }}' ]; then
        python -m pip install 'sigantry-core==${{ parameters.fabricDataopsVersion }}'
      else
        python -m pip install sigantry-core
      fi
    displayName: 'pip install sigantry-core (from ADO Artifacts)'

  - task: AzureCLI@2
    displayName: 'sigantry deploy run (${{ parameters.environment }})'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      addSpnToEnvironment: true
      inlineScript: |
        set -e
        sigantry deploy run \
          --source '${{ parameters.sourceDir }}' \
          --workspace-id '${{ parameters.workspaceId }}' \
          --environment '${{ parameters.environment }}' \
          --params '${{ parameters.parametersPath }}' \
          --item-types '${{ parameters.itemTypes }}'
