# templates/stages/cd-prod.yml
# sigantry-dual-ci-exception: ci-mechanics
# ------------------------------------------------------------------
# Continuous Deployment to the `fabric-prod` ADO environment (master-only).
# Exception rationale (BRIEF-06 / Phase 10 Plan 06): legacy Phase 5
# ADO-only CD template. Replaced in Phase 12 by paired
# Sigantry-namespaced deploy templates that the dual-ci-parity
# lint enforces directly.
#
# Sources (Pitfall 14 / Phase 5 Success Criterion 1):
#   Microsoft Learn - Deployment jobs
#     https://learn.microsoft.com/azure/devops/pipelines/process/deployment-jobs
#     ms.date: 2026-04-20
#   Microsoft Learn - Approvals and checks
#     https://learn.microsoft.com/azure/devops/pipelines/process/approvals
#     ms.date: 2026-04-20
#
# The approval policy for `fabric-prod` is attached via the ADO UI.
# Removing `environment: 'fabric-prod'` from the deployment job does NOT
# bypass approval - it makes the deployment fail to target any
# environment at all (T-5-03 mitigation).
# ------------------------------------------------------------------

parameters:
  - name: workspaceId
    type: string
  - name: serviceConnection
    type: string
  - name: sourceDir
    type: string
    default: 'fabric_items/'
  - name: parametersPath
    type: string
    default: 'parameters.yml'
  - name: environment
    type: string
    default: 'PROD'
  - name: itemTypes
    type: string
    default: 'Lakehouse,Environment,Notebook,DataPipeline'
  - name: dependsOn
    type: object
    default:
      - cd_test
  - name: condition
    type: string
    default: "and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))"

stages:
  - stage: cd_prod
    displayName: 'CD - fabric-prod'
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - deployment: deploy_prod
        displayName: 'Deploy to fabric-prod'
        environment: 'fabric-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: ../steps/fabric-deploy.yml
                  parameters:
                    workspaceId: ${{ parameters.workspaceId }}
                    serviceConnection: ${{ parameters.serviceConnection }}
                    sourceDir: ${{ parameters.sourceDir }}
                    parametersPath: ${{ parameters.parametersPath }}
                    environment: ${{ parameters.environment }}
                    itemTypes: ${{ parameters.itemTypes }}
