# templates/stages/sigantry-cd.yml
# ------------------------------------------------------------------
# Sigantry five-stage deploy template (PIPELINE-01).
# approval -> deploy -> smoke -> integration -> promote
#
# Renamed from sigantry-deploy-with-tests.yml on 2026-05-12 to match the
# GHA half rename. See the .github/workflows/sigantry-cd.yml header for
# context.
#
# Paired with .github/workflows/sigantry-cd.yml.
# Parity enforced by scripts/ci/check-dual-ci-parity.py (Plan 10-06).
#
# Documented divergences from the GHA half (must appear BYTE-IDENTICALLY
# in the GHA workflow header so check-dual-ci-parity.py:466 sees them as
# `shared_ignores`; either reason alone silences all parameter extras):
# sigantry-dual-ci-ignore: gha-uses-oidc-not-service-connection
# sigantry-dual-ci-ignore: ado-gh-env-naming
#
# Order: the approval stage runs FIRST, so the environment's reviewers
# clear the deploy before anything is published; promote records the
# release afterwards. `sigantryVersion` pins the package in every stage
# (empty = latest); each stage runs on a fresh agent and installs it
# through steps/sigantry-install.yml (deploy: steps/fabric-deploy.yml).
#
# Sources (Pitfall 14 / Phase 5 Success Criterion 1):
#   Microsoft Learn - Deployment jobs
#     https://learn.microsoft.com/azure/devops/pipelines/process/deployment-jobs
#     ms.date: 2025-07-17
#   Microsoft Learn - Approvals and checks
#     https://learn.microsoft.com/azure/devops/pipelines/process/approvals
#   Microsoft Learn - Stages
#     https://learn.microsoft.com/azure/devops/pipelines/process/stages
# ------------------------------------------------------------------

parameters:
  - name: workspaceId
    type: string
  - name: serviceConnection
    type: string
  - name: environment
    type: string
  - name: sourceDir
    type: string
    default: 'fabric_items/'
  - name: parametersPath
    type: string
    default: 'parameters.yml'
  - name: itemTypes
    type: string
    default: 'Lakehouse,Environment,Notebook,DataPipeline'
  - name: smokeCommand
    type: string
    default: 'sigantry doctor'
  - name: integrationCommand
    type: string
    default: 'python -m pytest tests/integration/ -m sigantry_pipeline -v'
  - name: adoApprovalEnvironment
    type: string
  - name: releaseId
    type: string
    default: '$(Build.BuildId)'
  - name: workItems
    type: string
    default: ''
  - name: approver
    type: string
    default: '$(Build.RequestedForEmail)'
  - name: fabricItems
    type: string
    default: ''
  - name: auditDir
    type: string
    default: '.sigantry/audit'
  - name: sigantryVersion
    type: string
    default: ''

stages:
  - stage: approval
    displayName: 'Awaiting approval'
    dependsOn: []
    jobs:
      - deployment: gate
        displayName: 'Approval gate'
        environment: ${{ parameters.adoApprovalEnvironment }}    # required reviewers attached via UI (D-04)
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Approval granted for environment ${{ parameters.adoApprovalEnvironment }}"
                  displayName: 'Approval acknowledged'

  - stage: deploy
    displayName: 'Deploy'
    dependsOn: [approval]
    jobs:
      - deployment: deploy
        displayName: 'sigantry deploy run'
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: ../steps/fabric-deploy.yml
                  parameters:
                    workspaceId: ${{ parameters.workspaceId }}
                    serviceConnection: ${{ parameters.serviceConnection }}
                    sourceDir: ${{ parameters.sourceDir }}
                    parametersPath: ${{ parameters.parametersPath }}
                    environment: ${{ parameters.environment }}
                    itemTypes: ${{ parameters.itemTypes }}
                    fabricDataopsVersion: ${{ parameters.sigantryVersion }}

  - stage: smoke
    displayName: 'Smoke'
    dependsOn: [deploy]
    jobs:
      - job: smoke
        displayName: 'Smoke checks'
        steps:
          - template: ../steps/sigantry-install.yml
            parameters:
              sigantryVersion: ${{ parameters.sigantryVersion }}
          - script: ${{ parameters.smokeCommand }}
            displayName: 'Run smoke command'

  - stage: integration
    displayName: 'Integration'
    dependsOn: [smoke]
    jobs:
      - job: integration
        displayName: 'Integration tests'
        steps:
          - template: ../steps/sigantry-install.yml
            parameters:
              sigantryVersion: ${{ parameters.sigantryVersion }}
          - script: ${{ parameters.integrationCommand }}
            displayName: 'Run integration command'

  - stage: promote
    displayName: 'Promote (record release)'
    dependsOn: [integration]
    jobs:
      - deployment: promote
        displayName: 'sigantry release record'
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: ../steps/sigantry-install.yml
                  parameters:
                    sigantryVersion: ${{ parameters.sigantryVersion }}
                - task: AzureCLI@2
                  displayName: 'sigantry release record'
                  # WR-05 review fix: operator inputs are passed via the
                  # ``env:`` block (which ADO escapes correctly) rather
                  # than template-time interpolated into a bash
                  # single-quoted string. The previous form broke on any
                  # apostrophe in an operator-typed value (e.g.
                  # approver=Maria O'Connor) and was a latent
                  # command-injection surface even inside the
                  # service-connection trust boundary.
                  env:
                    SIGANTRY_RELEASE_ID: ${{ parameters.releaseId }}
                    SIGANTRY_WORKSPACE_ID: ${{ parameters.workspaceId }}
                    SIGANTRY_WORK_ITEMS: ${{ parameters.workItems }}
                    SIGANTRY_APPROVER: ${{ parameters.approver }}
                    SIGANTRY_FABRIC_ITEMS: ${{ parameters.fabricItems }}
                    SIGANTRY_SOURCE_DIR: ${{ parameters.sourceDir }}
                    SIGANTRY_AUDIT_DIR: ${{ parameters.auditDir }}
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      if [ -z "$SIGANTRY_FABRIC_ITEMS" ] && [ -d "$SIGANTRY_SOURCE_DIR" ]; then
                        SIGANTRY_FABRIC_ITEMS=$(python -c 'import sys, pathlib; p = pathlib.Path(sys.argv[1]); print(",".join(sorted(f.parent.name for f in p.rglob(".platform") if "." in f.parent.name)))' "$SIGANTRY_SOURCE_DIR")
                      fi
                      sigantry release record \
                        --release-id "$SIGANTRY_RELEASE_ID" \
                        --workspace "$SIGANTRY_WORKSPACE_ID" \
                        --work-items "$SIGANTRY_WORK_ITEMS" \
                        --approver "$SIGANTRY_APPROVER" \
                        --fabric-items "$SIGANTRY_FABRIC_ITEMS" \
                        --audit-dir "$SIGANTRY_AUDIT_DIR" \
                        --provider ado \
                        --ado-organization "$(System.CollectionUri)" \
                        --ado-project "$(System.TeamProject)"
                - script: |
                    set -e
                    sigantry release verify --audit-dir "$SIGANTRY_AUDIT_DIR"
                  displayName: 'sigantry release verify'
                  env:
                    SIGANTRY_AUDIT_DIR: ${{ parameters.auditDir }}
                - publish: ${{ parameters.auditDir }}
                  artifact: sigantry-audit-ledger
                  displayName: 'Upload audit ledger artifact'
                  condition: always()
