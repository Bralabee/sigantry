# Dependabot configuration.
#
# Companion to the SHA-pinning of every ``uses:`` reference across
# ``.github/workflows/*.yml``. Without this config a SHA-pinned
# workflow becomes a frozen-in-time security risk -- pinned references
# are stable but they DO drift behind upstream patches (CVE fixes,
# bug fixes). Dependabot bumps them with a grouped PR per group and
# rewrites the version comment alongside the SHA.
#
# The cadence is monthly because a bot PR is not merged as-is: its
# changes are carried in a maintainer-owned PR and the bot PR is closed.
# (The pin test requires every workflow to pin ``actions/checkout``, and
# ``actions/setup-python``, to the same SHA, so those moves are made
# across all workflows at once.) Grouping keeps related action bumps in
# one PR (``actions/*`` move together) instead of one PR per action.
#
# ``labels: []`` is deliberate: omitting the key makes Dependabot apply,
# and create if missing, its default labels. Nothing consumes them.
#
# Only GitHub Actions are covered. Python dependencies are declared as
# ranges in ``pyproject.toml`` with no lock file, and pre-commit hook
# ``rev:`` values are bumped by hand.
#
# References:
#   - SHA-pin format the workflows expect:
#     ``actions/X@<40-char SHA>  # v<N>``
#     (Dependabot rewrites both the SHA and the trailing comment).
#   - https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Etc/UTC
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
      third-party-actions:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
    commit-message:
      prefix: "chore(actions)"
      include: scope
    labels: []
    open-pull-requests-limit: 5
