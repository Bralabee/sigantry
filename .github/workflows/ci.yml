# sigantry-dual-ci-exception: ci-mechanics
name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  # Callable so the PyPI release path gates on these SAME quality jobs, and
  # publishes the `dist` artifact the `build` job below makes, verified
  # against this output. See publish-pypi.yml.
  workflow_call:
    outputs:
      dist-sha256:
        description: The SHA-256 of each file in the `dist` artifact, as sha256sum prints it.
        value: ${{ jobs.build.outputs.dist-sha256 }}

concurrency:
  # `github.workflow` is the CALLER's workflow name in a reusable workflow,
  # so a release's quality gate (publish-pypi -> this file) lands in a
  # different group from the `push: tags` run of the same tag. Keyed on
  # `github.ref` alone they collide and cancel-in-progress kills one --
  # and if that is the release's gate, the publish job is skipped and
  # nothing ships, as a cancellation rather than a red X.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a tag or release-path run. Two
  # runs of the release path on the SAME ref share both keys, so `true`
  # would let the newer cancel the older's quality gate and skip the
  # publish -- reported as a cancellation rather than a red X.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check sigantry_core/ tests/ scripts/
      - name: Ruff format check
        run: ruff format --check sigantry_core/ tests/ scripts/

  types:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      # Covers every root the project owns that mypy can parse; both are
      # clean, so this job starts green and any regression is the PR that
      # caused it. `tests/` is deliberately absent: it fails module
      # resolution before type checking even begins (duplicate basenames,
      # no `__init__.py`), which is a separate piece of work.
      - name: Mypy
        run: mypy sigantry_core/ scripts/

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[test]'
      - name: Run pytest
        run: python -m pytest tests/ -m "not integration and not smoke"

  build:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest
    # Every quality job gates the artifact, `types` included. A job skipped
    # because a dependency failed still reports a check run, and GitHub
    # counts a skipped run as SATISFYING its required context -- so gating
    # `build` on a job that is not ITSELF required would let a failure skip
    # `build` and hand branch protection a green "Build & Verify Artifacts"
    # on a broken tree. `Type Check (mypy)` became a required context on
    # `main` on 2026-09-21, so that laundering route is closed and `types`
    # belongs here. Anything added to this list must be required too.
    needs: [lint, test, types]
    # In a release run (publish-pypi.yml) this is the build that ships: the
    # publish job uploads this job's `dist` artifact to PyPI and builds
    # nothing itself, so what is checked here is what is published.
    outputs:
      dist-sha256: ${{ steps.record.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist & wheel
        run: python -m build
      # --strict: this is the strict metadata check on the files a release
      # publishes. A defect that is only a warning would otherwise pass here
      # and surface at upload.
      - name: Twine check
        run: twine check --strict dist/*
      # The publish job checks the artifact it downloads against this.
      - name: Record the SHA-256 of the distributions
        id: record
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/dist.sha256"
          cat "$RUNNER_TEMP/dist.sha256"
          {
            echo 'sha256<<DIST_SHA256'
            cat "$RUNNER_TEMP/dist.sha256"
            echo 'DIST_SHA256'
          } >> "$GITHUB_OUTPUT"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
