# sigantry-dual-ci-exception: ci-mechanics
name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check sigantry_core/ tests/ scripts/
      - name: Ruff format check
        run: ruff format --check sigantry_core/ tests/ scripts/

  types:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      # Scoped to the shipped library, which is clean today so this job starts
      # green and any regression is the PR that caused it. scripts/ currently
      # has 8 pre-existing errors in 5 files (measured; 2 need the types-Markdown
      # stub); widening to
      # it is a follow-up, not a silent omission.
      - name: Mypy
        run: mypy sigantry_core/

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[test]'
      - name: Run pytest
        run: python -m pytest tests/ -m "not integration and not smoke"

  build:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest
    # `types` is deliberately NOT in this list while it is not a required
    # status check. A job skipped because a dependency failed still reports a
    # check run, and GitHub counts a skipped run as satisfying its required
    # context -- so `needs: types` would let a type error skip `build` and hand
    # branch protection a green "Build & Verify Artifacts" on a broken tree.
    # That is strictly worse than not gating on types at all. Add `types` here
    # only once `Type Check (mypy)` is itself a required context on `main`.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist & wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
