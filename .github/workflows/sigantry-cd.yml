# .github/workflows/sigantry-cd.yml
# ------------------------------------------------------------------
# Sigantry five-job GHA workflow (PIPELINE-02).
# approval -> deploy -> smoke -> integration -> promote
#
# Paired with templates/stages/sigantry-cd.yml.
# Parity enforced by scripts/ci/check-dual-ci-parity.py (Plan 10-06).
#
# Documented divergences from the ADO half (BYTE-IDENTICAL to the
# corresponding lines in templates/stages/sigantry-cd.yml so
# check-dual-ci-parity.py:466 sees them as `shared_ignores`. The
# parity script scans the first 20 header lines for these markers --
# keep them above line 20):
# sigantry-dual-ci-ignore: gha-uses-oidc-not-service-connection
# sigantry-dual-ci-ignore: ado-gh-env-naming
# sigantry-dual-ci-ignore: ado-uses-artifacts-feed
#
# Authentication: every job that calls Fabric signs in with azure/login
# through OIDC (`azureClientId` + `azureTenantId`, no secret), which
# puts an `az` session in place for sigantry's DefaultAzureCredential
# chain. Only those jobs hold `id-token: write`, and only promote holds
# `actions: read` to read the run's approval record; a caller using
# `workflow_call:` must grant both in its own `permissions:` block, or
# GitHub caps them. Those jobs also declare `environment: inputs.environment`
# so their OIDC token subject is `repo:<org>/<repo>:environment:<environment>`,
# the one subject the federated credential names; that environment carries
# no required reviewers (the reviewers sit on `ghApprovalEnvironment`).
# `sigantryVersion` pins the package in every job
# (empty = latest). Operator inputs reach bash through `env:` only
# (WR-05), never interpolated into a script.
#
# Order: the approval gate runs FIRST, so the reviewer clears the
# deploy before anything is published; promote then records the
# release with the approver read from GitHub's own approval record for
# the run, not from whoever started it.
#
# Renamed from sigantry-deploy-with-tests.yml on 2026-05-12 as part of
# the ghost-runs fix. Real root cause: the ``releaseId`` and
# ``approver`` input ``default:`` slots carried ``${{ github.run_id }}``
# / ``${{ github.actor }}`` expressions, which GitHub's parser rejects
# (defaults are evaluated at parse time, before the github context is
# bound). The parse failure produced (a) a stuck registration recording
# the file PATH as the display ``name``, and (b) a 0-job failed "ghost
# run" on every push event. Defaults now empty; ``github.*`` fallback
# moved into the promote job's env block where the context resolves
# correctly.
#
# Sources:
#   GitHub Docs - Workflow syntax for GitHub Actions
#     https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
#   GitHub Docs - Using environments for deployment
#     https://docs.github.com/actions/deployment/targeting-different-environments/using-environments-for-deployment
#   GitHub Docs - Reviewing deployments
#     https://docs.github.com/actions/managing-workflow-runs/reviewing-deployments
#   GitHub Docs - REST: Get the review history for a workflow run
#     https://docs.github.com/en/rest/actions/workflow-runs#get-the-review-history-for-a-workflow-run
#   Azure/login - OIDC login without a subscription
#     https://github.com/Azure/login#login-with-openid-connect-oidc-recommended
# ------------------------------------------------------------------
name: sigantry-deploy-with-tests

on:
  workflow_dispatch:
    inputs:
      workspaceId:           { type: string,  required: true }
      environment:           { type: string,  required: true }
      azureClientId:         { type: string,  required: true }
      azureTenantId:         { type: string,  required: true }
      sourceDir:             { type: string,  required: false, default: 'fabric_items/' }
      parametersPath:        { type: string,  required: false, default: 'parameters.yml' }
      itemTypes:             { type: string,  required: false, default: 'Lakehouse,Environment,Notebook,DataPipeline' }
      smokeCommand:          { type: string,  required: false, default: 'sigantry doctor' }
      integrationCommand:    { type: string,  required: false, default: 'python -m pytest tests/integration/ -m sigantry_pipeline -v' }
      ghApprovalEnvironment: { type: string,  required: true }
      releaseId:             { type: string,  required: false, default: '' }
      workItems:             { type: string,  required: true }
      approver:              { type: string,  required: false, default: '' }
      fabricItems:           { type: string,  required: false, default: '' }
      auditDir:              { type: string,  required: false, default: '.sigantry/audit' }
      sigantryVersion:       { type: string,  required: false, default: '' }
  workflow_call:
    inputs:
      workspaceId:           { type: string,  required: true }
      environment:           { type: string,  required: true }
      azureClientId:         { type: string,  required: true }
      azureTenantId:         { type: string,  required: true }
      sourceDir:             { type: string,  required: false, default: 'fabric_items/' }
      parametersPath:        { type: string,  required: false, default: 'parameters.yml' }
      itemTypes:             { type: string,  required: false, default: 'Lakehouse,Environment,Notebook,DataPipeline' }
      smokeCommand:          { type: string,  required: false, default: 'sigantry doctor' }
      integrationCommand:    { type: string,  required: false, default: 'python -m pytest tests/integration/ -m sigantry_pipeline -v' }
      ghApprovalEnvironment: { type: string,  required: true }
      releaseId:             { type: string,  required: false, default: '' }
      workItems:             { type: string,  required: true }
      approver:              { type: string,  required: false, default: '' }
      fabricItems:           { type: string,  required: false, default: '' }
      auditDir:              { type: string,  required: false, default: '.sigantry/audit' }
      sigantryVersion:       { type: string,  required: false, default: '' }

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  approval:
    name: Awaiting approval
    runs-on: ubuntu-latest
    environment: ${{ inputs.ghApprovalEnvironment }}     # GitHub environment with required_reviewers (D-04)
    steps:
      - name: Validate required governance inputs
        env:
          SIGANTRY_GATE_ENVIRONMENT: ${{ inputs.ghApprovalEnvironment }}
          SIGANTRY_WORK_ITEMS: ${{ inputs.workItems }}
        run: |
          set -e
          if [ -z "${SIGANTRY_WORK_ITEMS// /}" ]; then
            echo "::error::workItems must not be empty; pass at least one work item ID before deploying"
            exit 1
          fi
          echo "Approval granted for environment $SIGANTRY_GATE_ENVIRONMENT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [approval]
    environment: ${{ inputs.environment }}   # OIDC subject; no reviewers on this environment
    permissions:
      contents: read
      id-token: write   # azure/login OIDC token, this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.11' }   # no cache beside the OIDC token (SEC-14)
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azureClientId }}
          tenant-id: ${{ inputs.azureTenantId }}
          allow-no-subscriptions: true
      - name: Install sigantry
        env:
          SIGANTRY_VERSION: ${{ inputs.sigantryVersion }}
        run: pip install "sigantry${SIGANTRY_VERSION:+==$SIGANTRY_VERSION}"
      - name: sigantry deploy run
        env:
          SIGANTRY_SOURCE_DIR: ${{ inputs.sourceDir }}
          SIGANTRY_WORKSPACE_ID: ${{ inputs.workspaceId }}
          SIGANTRY_ENVIRONMENT: ${{ inputs.environment }}
          SIGANTRY_PARAMETERS_PATH: ${{ inputs.parametersPath }}
          SIGANTRY_ITEM_TYPES: ${{ inputs.itemTypes }}
        run: |
          sigantry deploy run \
            --source "$SIGANTRY_SOURCE_DIR" \
            --workspace-id "$SIGANTRY_WORKSPACE_ID" \
            --environment "$SIGANTRY_ENVIRONMENT" \
            --params "$SIGANTRY_PARAMETERS_PATH" \
            --item-types "$SIGANTRY_ITEM_TYPES"

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.11' }
      - name: Install sigantry
        env:
          SIGANTRY_VERSION: ${{ inputs.sigantryVersion }}
        run: pip install "sigantry${SIGANTRY_VERSION:+==$SIGANTRY_VERSION}"
      - name: Run smoke command
        env:
          SIGANTRY_SMOKE_COMMAND: ${{ inputs.smokeCommand }}
        run: bash -c "$SIGANTRY_SMOKE_COMMAND"

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [smoke]
    environment: ${{ inputs.environment }}   # OIDC subject; no reviewers on this environment
    permissions:
      contents: read
      id-token: write   # azure/login OIDC token, this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.11' }
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azureClientId }}
          tenant-id: ${{ inputs.azureTenantId }}
          allow-no-subscriptions: true
      - name: Install sigantry and the consumer's test extras
        env:
          SIGANTRY_VERSION: ${{ inputs.sigantryVersion }}
        run: |
          set -e
          pip install "sigantry${SIGANTRY_VERSION:+==$SIGANTRY_VERSION}"
          python -m pip install pytest
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m pip install '.[dev,test]'
          fi
      - name: Run integration command
        env:
          SIGANTRY_INTEGRATION_COMMAND: ${{ inputs.integrationCommand }}
        run: bash -c "$SIGANTRY_INTEGRATION_COMMAND"

  promote:
    name: Promote
    runs-on: ubuntu-latest
    needs: [integration]
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # azure/login OIDC token, this job only
      actions: read     # the run's approval record
      issues: write     # sigantry release record posts to GitHub issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.11' }
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azureClientId }}
          tenant-id: ${{ inputs.azureTenantId }}
          allow-no-subscriptions: true
      - name: Install sigantry
        env:
          SIGANTRY_VERSION: ${{ inputs.sigantryVersion }}
        run: pip install "sigantry${SIGANTRY_VERSION:+==$SIGANTRY_VERSION}"
      - name: Resolve the approver from the run's approval record
        id: approver
        # The ledger's approver is whoever cleared the approval gate
        # (`ghApprovalEnvironment`), which GitHub records per run. That record
        # is authoritative: the operator-typed `approver` input is only a
        # fallback when no approval record exists, and self-approval or
        # missing approver fails closed (SIG-006).
        env:
          GH_TOKEN: ${{ github.token }}
          SIGANTRY_APPROVER_INPUT: ${{ inputs.approver }}
          SIGANTRY_GATE_ENVIRONMENT: ${{ inputs.ghApprovalEnvironment }}
          SIGANTRY_RUN_ID: ${{ github.run_id }}
          SIGANTRY_REPOSITORY: ${{ github.repository }}
          SIGANTRY_ACTOR: ${{ github.actor }}
        run: |
          set -e
          login=""
          if approvals=$(gh api "repos/$SIGANTRY_REPOSITORY/actions/runs/$SIGANTRY_RUN_ID/approvals" 2>&1); then
            login=$(jq -r --arg env "$SIGANTRY_GATE_ENVIRONMENT" \
              '[.[] | select(.state == "approved") | select(any(.environments[]?; .name == $env))] | last | .user.login // empty' \
              <<< "$approvals")
          else
            echo "::warning::could not read the approval record for run $SIGANTRY_RUN_ID (does the caller grant actions: read?): $approvals"
          fi
          actor_noreply="${SIGANTRY_ACTOR}@users.noreply.github.com"
          if [ -n "$login" ]; then
            if [ "$login" = "$SIGANTRY_ACTOR" ]; then
              echo "::error::Self-approval is not permitted: reviewer '$login' matches triggering actor '$SIGANTRY_ACTOR'"
              exit 1
            fi
            approver="${login}@users.noreply.github.com"
            if [ -n "$SIGANTRY_APPROVER_INPUT" ] && [ "$SIGANTRY_APPROVER_INPUT" != "$approver" ]; then
              echo "::warning::approver input ignored: the approval record for $SIGANTRY_GATE_ENVIRONMENT names $login"
            fi
          elif [ -n "$SIGANTRY_APPROVER_INPUT" ]; then
            if [ "$SIGANTRY_APPROVER_INPUT" = "$SIGANTRY_ACTOR" ] || [ "$SIGANTRY_APPROVER_INPUT" = "$actor_noreply" ]; then
              echo "::error::Self-approval is not permitted: inputs.approver ('$SIGANTRY_APPROVER_INPUT') matches triggering actor ('$SIGANTRY_ACTOR')"
              exit 1
            fi
            echo "::warning::no approval record for $SIGANTRY_GATE_ENVIRONMENT in run $SIGANTRY_RUN_ID; recording the operator-supplied approver"
            approver="$SIGANTRY_APPROVER_INPUT"
          else
            echo "::error::no approval record for $SIGANTRY_GATE_ENVIRONMENT in run $SIGANTRY_RUN_ID and no explicit approver input provided; refusing to record triggering actor ('$SIGANTRY_ACTOR') as approver"
            exit 1
          fi
          echo "approver=$approver" >> "$GITHUB_OUTPUT"
      - name: sigantry release record
        # WR-05 review fix: operator inputs are passed via the ``env:``
        # block (which GHA expands BEFORE bash sees the script) rather
        # than template-time interpolated into a bash single-quoted
        # string. The previous form broke on any apostrophe in an
        # operator-typed value (e.g. approver=Maria O'Connor) and was a
        # latent command-injection surface.
        env:
          # github.run_id fallback lives here, not in the input
          # `default:` slot. GitHub's workflow parser rejects ${{ github.* }}
          # inside default values (defaults are evaluated at parse time,
          # before the github context is bound) -- that was the real
          # ghost-runs root cause (fixed in a 2026-05-12 follow-up).
          GITHUB_TOKEN: ${{ github.token }}
          SIGANTRY_RELEASE_ID: ${{ inputs.releaseId != '' && inputs.releaseId || github.run_id }}
          SIGANTRY_WORKSPACE_ID: ${{ inputs.workspaceId }}
          SIGANTRY_WORK_ITEMS: ${{ inputs.workItems }}
          SIGANTRY_APPROVER: ${{ steps.approver.outputs.approver }}
          SIGANTRY_FABRIC_ITEMS: ${{ inputs.fabricItems }}
          SIGANTRY_SOURCE_DIR: ${{ inputs.sourceDir }}
          SIGANTRY_ITEM_TYPES: ${{ inputs.itemTypes }}
          SIGANTRY_AUDIT_DIR: ${{ inputs.auditDir != '' && inputs.auditDir || '.sigantry/audit' }}
          SIGANTRY_GITHUB_OWNER: ${{ github.repository_owner }}
          SIGANTRY_GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          if [ -z "$SIGANTRY_FABRIC_ITEMS" ] && [ -d "$SIGANTRY_SOURCE_DIR" ]; then
            SIGANTRY_FABRIC_ITEMS=$(python -c '
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          allowed = {t.strip() for t in sys.argv[2].split(",") if t.strip()}
          items = []
          for pf in sorted(root.rglob(".platform")):
              name, itype = "", ""
              try:
                  meta = json.loads(pf.read_text("utf-8")).get("metadata") or {}
                  name = str(meta.get("displayName") or "").strip()
                  itype = str(meta.get("type") or "").strip()
              except Exception:
                  pass
              if (not name or not itype) and "." in pf.parent.name:
                  name, itype = pf.parent.name.rsplit(".", 1)
              if name and itype and (not allowed or itype in allowed):
                  items.append(f"{name}:{itype}")
          print(",".join(sorted(set(items))))
          ' "$SIGANTRY_SOURCE_DIR" "$SIGANTRY_ITEM_TYPES")
          fi
          sigantry release record \
            --release-id "$SIGANTRY_RELEASE_ID" \
            --workspace "$SIGANTRY_WORKSPACE_ID" \
            --work-items "$SIGANTRY_WORK_ITEMS" \
            --approver "$SIGANTRY_APPROVER" \
            --fabric-items "$SIGANTRY_FABRIC_ITEMS" \
            --audit-dir "$SIGANTRY_AUDIT_DIR" \
            --provider github \
            --github-owner "$SIGANTRY_GITHUB_OWNER" \
            --github-repo "$SIGANTRY_GITHUB_REPO"
      - name: sigantry release verify
        env:
          SIGANTRY_AUDIT_DIR: ${{ inputs.auditDir != '' && inputs.auditDir || '.sigantry/audit' }}
        run: |
          sigantry release verify --audit-dir "$SIGANTRY_AUDIT_DIR"
      - name: Upload audit ledger artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigantry-audit-ledger
          path: ${{ inputs.auditDir != '' && inputs.auditDir || '.sigantry/audit' }}
