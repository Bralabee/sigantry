# .github/workflows/drift-check.yml
# ------------------------------------------------------------------
# Sigantry drift-check workflow (DRIFT-03).
# Caller's schedule -> sigantry diff --output json --fail-on-drift -> notification sink
#
# Paired with templates/schedules/drift-check.yml.
# Parity enforced by scripts/ci/check-dual-ci-parity.py (Plan 10-06).
# Second non-exception pair under the dual-CI parity lint
# (first was Phase 12 PIPELINE-01/02).
#
# Documented divergences from the ADO half (byte-identical to the
# corresponding lines in templates/schedules/drift-check.yml):
# sigantry-dual-ci-ignore: gha-uses-oidc-not-service-connection
# sigantry-dual-ci-ignore: ado-gh-env-naming
# sigantry-dual-ci-ignore: ado-uses-artifacts-feed
#
# This workflow carries NO `schedule:` trigger. A scheduled run receives an
# EMPTY `inputs` context -- declared defaults are not applied either -- so a
# schedule here ran `sigantry diff` with no workspace or manifest and failed
# every day. Adopters schedule a caller workflow that passes the inputs via
# `with:` (docs/runbooks/drift-detection/scheduled-drift.md, "GHA").
# The parity lint compares parameters, not triggers, so this difference
# carries no ignore token: a token read by the lint would also excuse any
# parameter present only on the ADO side.
#
# Authentication: the drift job signs in with azure/login through OIDC
# (`azureClientId` + `azureTenantId`, no secret) for sigantry's
# DefaultAzureCredential chain; only that job holds `id-token: write`,
# which a `workflow_call:` caller must grant too. `sigantryVersion` pins
# the package (empty = latest) and reaches bash through `env:` (WR-05).
#
# Sources (Plan 13-06 / DRIFT-03):
#   GitHub Docs -- Workflow syntax (on: schedule)
#     https://docs.github.com/actions/reference/workflow-syntax-for-github-actions
#   GitHub Docs -- Events that trigger workflows
#     https://docs.github.com/actions/reference/events-that-trigger-workflows
# ------------------------------------------------------------------
name: drift-check

on:
  workflow_dispatch:
    inputs:
      workspaceId:      { type: string, required: true }
      environment:      { type: string, required: false, default: 'prod' }
      manifestPath:     { type: string, required: false, default: 'sync.yml' }
      notificationSink: { type: string, required: false, default: 'teams' }
      cron:             { type: string, required: false, default: '0 6 * * *' }
      azureClientId:    { type: string, required: true }
      azureTenantId:    { type: string, required: true }
      sigantryVersion:  { type: string, required: false, default: '' }
  workflow_call:
    inputs:
      workspaceId:      { type: string, required: true }
      environment:      { type: string, required: false, default: 'prod' }
      manifestPath:     { type: string, required: false, default: 'sync.yml' }
      notificationSink: { type: string, required: false, default: 'teams' }
      cron:             { type: string, required: false, default: '0 6 * * *' }
      azureClientId:    { type: string, required: true }
      azureTenantId:    { type: string, required: true }
      sigantryVersion:  { type: string, required: false, default: '' }
    # The notify job's sink settings (#131). A caller passes them with
    # `secrets: inherit` or by name; each is optional, and only the ones the
    # chosen sink needs are read.
    secrets:
      SIGANTRY_TEAMS_WEBHOOK: { required: false }
      SIGANTRY_TEAMS_WEBHOOK_FORMAT: { required: false }
      SIGANTRY_SLACK_WEBHOOK: { required: false }
      SIGANTRY_SMTP_HOST: { required: false }
      SIGANTRY_SMTP_PORT: { required: false }
      SIGANTRY_SMTP_USER: { required: false }
      SIGANTRY_SMTP_PASSWORD: { required: false }
      SIGANTRY_SMTP_FROM: { required: false }
      SIGANTRY_SMTP_TO: { required: false }
      SIGANTRY_SMTP_USE_TLS: { required: false }

permissions:
  contents: read

jobs:
  drift_check:
    name: Drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # azure/login OIDC token, this job only
    # WR-05 / Pitfall 8 inheritance (D-28): operator inputs are passed
    # via the ``env:`` block (which GHA expands BEFORE bash sees the
    # script) rather than template-time interpolated into a bash
    # single-quoted string. Avoids command-injection on apostrophes in
    # operator-typed values.
    env:
      SIGANTRY_DRIFT_WORKSPACE_ID: ${{ inputs.workspaceId }}
      SIGANTRY_DRIFT_MANIFEST_PATH: ${{ inputs.manifestPath }}
      SIGANTRY_DRIFT_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.11' }
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azureClientId }}
          tenant-id: ${{ inputs.azureTenantId }}
          allow-no-subscriptions: true
      - name: Install sigantry
        env:
          SIGANTRY_VERSION: ${{ inputs.sigantryVersion }}
        run: pip install "sigantry${SIGANTRY_VERSION:+==$SIGANTRY_VERSION}"
      - name: sigantry diff (json + fail-on-drift)
        run: |
          set -e
          sigantry diff \
            --environment "$SIGANTRY_DRIFT_ENVIRONMENT" \
            --workspace-id "$SIGANTRY_DRIFT_WORKSPACE_ID" \
            --manifest "$SIGANTRY_DRIFT_MANIFEST_PATH" \
            --output json \
            --fail-on-drift > drift.json
      - name: Upload drift.json artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift_json
          path: drift.json

  notify:
    name: Notify on drift
    runs-on: ubuntu-latest
    needs: [drift_check]
    if: failure()
    # WR-05 / D-28: notification-sink config flows via ``env:`` block.
    # ``SIGANTRY_NOTIFICATION_SINK`` selects the sink kind (teams / slack /
    # email). The per-impl webhook URLs / SMTP settings are declared
    # `secrets:` above (a reusable workflow's env is not reachable from its
    # caller) and mapped on the dispatcher step only, so no other step,
    # action or install sees them (#131); an unset secret is an empty value.
    env:
      SIGANTRY_NOTIFICATION_SINK: ${{ inputs.notificationSink }}
      SIGANTRY_DRIFT_WORKSPACE_ID: ${{ inputs.workspaceId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.11' }
      - name: Install sigantry
        env:
          SIGANTRY_VERSION: ${{ inputs.sigantryVersion }}
        run: pip install "sigantry${SIGANTRY_VERSION:+==$SIGANTRY_VERSION}"
      # #34: when the drift job failed before uploading anything (checkout,
      # sign-in, install), there is no artifact. The dispatcher must still
      # run: it announces a missing drift.json as a check that produced no
      # report. So the download may fail without stopping the job.
      - name: Download drift.json artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: drift_json
      - name: Run notification dispatcher
        env:
          SIGANTRY_TEAMS_WEBHOOK: ${{ secrets.SIGANTRY_TEAMS_WEBHOOK }}
          SIGANTRY_TEAMS_WEBHOOK_FORMAT: ${{ secrets.SIGANTRY_TEAMS_WEBHOOK_FORMAT }}
          SIGANTRY_SLACK_WEBHOOK: ${{ secrets.SIGANTRY_SLACK_WEBHOOK }}
          SIGANTRY_SMTP_HOST: ${{ secrets.SIGANTRY_SMTP_HOST }}
          SIGANTRY_SMTP_PORT: ${{ secrets.SIGANTRY_SMTP_PORT }}
          SIGANTRY_SMTP_USER: ${{ secrets.SIGANTRY_SMTP_USER }}
          SIGANTRY_SMTP_PASSWORD: ${{ secrets.SIGANTRY_SMTP_PASSWORD }}
          SIGANTRY_SMTP_FROM: ${{ secrets.SIGANTRY_SMTP_FROM }}
          SIGANTRY_SMTP_TO: ${{ secrets.SIGANTRY_SMTP_TO }}
          SIGANTRY_SMTP_USE_TLS: ${{ secrets.SIGANTRY_SMTP_USE_TLS }}
        run: |
          set -e
          python -m sigantry_core.sync._notify_main \
            --drift-json drift.json \
            --workspace-id "$SIGANTRY_DRIFT_WORKSPACE_ID"
