# sigantry-dual-ci-exception: ci-mechanics
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The wheel that reaches PyPI is gated by the SAME lint, type and test
  # jobs that gate a pull request. Before this, the release path ran
  # checkout -> build -> publish with no quality job in front of it: CI's
  # `build` job gated only the throwaway CI `dist` artifact, never this.
  quality:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    name: Build & Publish to PyPI
    needs: [quality]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sigantry
    permissions:
      id-token: write  # Mandatory for PyPA OIDC trusted publishing
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata with twine
        run: twine check --strict dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
