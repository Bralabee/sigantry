# sigantry-dual-ci-exception: ci-mechanics
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The wheel that reaches PyPI is gated by the SAME lint, type and test
  # jobs that gate a pull request. Before this, the release path ran
  # checkout -> build -> publish with no quality job in front of it: CI's
  # `build` job gated only the throwaway CI `dist` artifact, never this.
  quality:
    name: CI
    # Its sibling pins its own scopes; this job runs the whole suite on three
    # OSes and needs nothing but the source, so it should not inherit whatever
    # the repo/org default grants.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    name: Build & Publish to PyPI
    needs: [quality]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sigantry
    permissions:
      id-token: write  # Mandatory for PyPA OIDC trusted publishing
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata with twine
        run: twine check --strict dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
