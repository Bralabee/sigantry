# sigantry -- pre-commit hook registrations
#
# Run ``pre-commit install`` once per clone to activate the hooks.
# Plan 04-02 (DEPLOY-02 + Pitfall 3 four-layer mitigation).
# Audit-2026-05-07 W3.5: standard set + ruff + detect-secrets + mypy
# added alongside the 2 custom Fabric hooks.
#
# All third-party hooks pin to a known good ``rev:``. No Dependabot
# entry covers them; bump each ``rev:`` by hand.
#
# The two ``fabric-check-*`` hooks remain ``language: system`` (stdlib
# only) so they run without installing the sigantry_core wheel into
# the pre-commit venv. They walk the working tree themselves
# (``pass_filenames: false``) so per-commit runtime stays deterministic
# regardless of staged file count.

repos:
  # ------------------------------------------------------------------
  # Standard hygiene set (Audit-2026-05-07 W3.5)
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Skip ``.platform`` files -- their JSON includes a trailing
        # newline that fabric-cicd inserts and we must preserve.
        exclude: '\.platform$'
      - id: end-of-file-fixer
        exclude: '\.platform$'
      - id: check-yaml
        # Some CI YAML uses Azure Pipelines ``${{ ... }}`` template
        # expansions that pyyaml refuses to parse without ``--unsafe``.
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        # ``.platform`` files carry CRLF intentionally per Plan 04-02.
        exclude: '\.platform$'

  # ------------------------------------------------------------------
  # Ruff (lint + format) -- mirrors pyproject.toml [tool.ruff] config
  # ------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ------------------------------------------------------------------
  # Secret detection
  # ------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # .secrets.baseline itself and test fixtures legitimately
        # carry hash-shaped strings.
        exclude: |
          (?x)^(
              \.secrets\.baseline|
              tests/.*/fixtures/.*
          )$

  # ------------------------------------------------------------------
  # Static typing: the CI command, run by the project env's mypy
  # ------------------------------------------------------------------
  # `language: system` runs the `mypy` on PATH with exactly the command
  # CI's `Type Check (mypy)` job runs (.github/workflows/ci.yml), over
  # both roots, with the pyproject.toml [tool.mypy] settings. There is
  # no isolated hook env and no mirrored dependency list, so the hook
  # and CI see the same installed types and report the same errors when
  # the env matches CI's (`pip install -e '.[dev]'`). The hook needs the
  # project env active: without it, `mypy` is not found or is another
  # env's, and the result says nothing about this tree.
  # `pass_filenames: false`: mypy always checks both roots whole, as CI
  # does; `files` only decides whether a commit triggers the hook.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (sigantry_core/ scripts/, as CI runs it)
        entry: mypy sigantry_core/ scripts/
        language: system
        types: [python]
        files: ^(sigantry_core|scripts)/
        pass_filenames: false

  # ------------------------------------------------------------------
  # Custom Fabric hooks (Plan 04-02 / DEPLOY-02 / Pitfall 3 mitigation)
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: fabric-check-logical-id
        name: fabric check duplicate Fabric logicalId
        entry: python scripts/pre_commit/check_logical_id.py
        language: system
        files: \.platform$
        pass_filenames: false
      - id: fabric-check-crlf
        name: fabric check CRLF in Fabric .platform + item-body files
        entry: python scripts/pre_commit/check_crlf.py
        language: system
        files: \.(platform|py|json)$
        pass_filenames: false
