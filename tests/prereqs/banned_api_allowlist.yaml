    pattern_class: hs2_repo_wide_grep
    rationale: |
      Operator-action queue (docs/operator/; moved from repo root 2026-06-12) for v3.0 UAT closure. By design references HS2 tenant + JToye SPN + ADO project names because those are the exact tenants/orgs/SPNs the operator must touch to close V3-RISK-1/2/3. Also embeds the canonical absolute path to the working tree for cp -a / git -C invocations operators can paste verbatim. Same allowlist rationale as CONSUMING.md (operator-facing root meta-doc).
  - path: 'docs/operator/ADOPTION-PLAN.md'
    pattern_class: hs2_repo_wide_grep
    rationale: |
      Operator execution plan (docs/operator/; moved from repo root 2026-06-12) (added 2026-06-11) for AIMS + DQ adoption of the toolkit -- the cross-repo workstream first recorded as an open item on 2026-04-21. By its nature it names the HS2 tenant workspaces, the AIMS/DQ sibling repos, the SPN coverage gap (V3-RISK-3) and the sigantry-hs2 plugin components whose keep/trim verdicts it schedules (W4). Same allowlist rationale as OPERATOR-PUNCHLIST.md and V3.X-ROADMAP.md (operator-facing root meta-doc that necessarily names the orgs/tenants whose actions drive it).
