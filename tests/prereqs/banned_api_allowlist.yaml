# Audit-2026-05-07 W4.3 -- structured banned-API allowlist.
#
# Replaces the inline 90-entry frozenset that previously lived in
# tests/prereqs/test_phase8_banned_apis.py:253-540. Each entry is a
# scoped exemption from the repo-wide hs2-substring grep gate
# (Plan 08-05 PROD-17), with explicit fields:
#
#   - path:           file path relative to the repository root
#   - pattern_class:  which banned-API rule this exempts
#                      (currently always "hs2_repo_wide_grep" --
#                       reserved for future per-rule scoping)
#   - adr:            optional ADR reference for governance trace
#   - rationale:      free-form justification (carries the comment
#                      that previously lived inline above the entry)
#
# This YAML file is itself the first allowlist entry below -- the
# structured rationales legitimately mention every plugin-package
# substring the gate matches.

allowlist:
  - path: 'tests/prereqs/banned_api_allowlist.yaml'
    pattern_class: hs2_repo_wide_grep
    rationale: |
      Audit-2026-05-07 W4.3: this YAML file replaces the pre-W4.3
      inline frozenset literal that was self-allowlisted in
      tests/prereqs/test_phase8_banned_apis.py. The structured
      rationale strings here legitimately enumerate the same plugin
      package substrings as the original frozenset comments. Same
      rationale category as the test_phase8_banned_apis.py
      self-allowlist below.
  - path: '.github/pull_request_template.md'
    pattern_class: hs2_repo_wide_grep
    rationale: 'Banned-api checklist (negative assertions against plugin names).'
  - path: '.azuredevops/pull_request_template.md'
    pattern_class: hs2_repo_wide_grep
    rationale: 'Documented exemption (rationale not captured during extraction).'
  - path: '.pre-commit-config.yaml'
    pattern_class: hs2_repo_wide_grep
    rationale: |
      Root configs that reference the monorepo package layout. historical hook rename context.
  - path: 'pyproject.toml'
    pattern_class: hs2_repo_wide_grep
    rationale: 'author string + testpaths + plugin note.'
  - path: 'docs/CONSUMING.md'
    pattern_class: hs2_repo_wide_grep
    rationale: |
      Operator-facing meta-doc (moved from repo root to docs/ in the 2026-06-12 docs reorg) enumerating the package distribution channels (PyPI plugin packages + planned public scaffolding repos). By design references plugin package names `sigantry-hs2` / `sigantry-jtoye` and the `Sigantry` / `SigantryHs2` PowerShell module names. Cannot live inside the plugin dirs because operators reading "how do I install Sigantry?" land at the repo root first (README links here).
  - path: 'docs/CAPABILITIES.md'
    pattern_class: hs2_repo_wide_grep
    rationale: |
      Root capability catalogue (added 2026-05-05, commit c096655). Comprehensive reference document complementing handbook.md; answers "what can Sigantry do today?" with verified citations and 9 mermaid diagrams. By design references the canonical registered seam impls -- `sigantry-hs2`'s `aims` (deploy profile), `dq_framework` (DQ gate), `log_analytics` (telemetry sink), `hs2_entra_group` (auth provider), `hs2_teams` (runbook registry), `hs2` (capacity policy) -- because those ARE the reference plugin implementations operators encounter via `sigantry doctor`. The AIMS 9-notebook canonical fixture is also cited as the worked example for `sync apply` since it's the example the Phase 13 docs ship across the runbook tree. Moving these references into `sigantry-hs2/docs/` would defeat the catalogue's purpose: operators reading "what can the base toolkit do?" land at the repo root, not inside a plugin. Same rationale category as CONSUMING.md.
  - path: 'docs/USER-GUIDE.md'
    pattern_class: hs2_repo_wide_grep
    rationale: |
      Root operator-facing PDF user guide source (added 2026-05-07, PR #81). Renders to docs/Sigantry-User-Guide.pdf via scripts/userguide/render.py and ships as an email attachment alongside the wheel. Legitimately enumerates the plugin model by naming sigantry-hs2 + sigantry-jtoye as worked examples (the architecture-agnostic point CANNOT be made without naming the customer-specific plugins it explicitly excludes from the base). Section 10's manifest example cites the AIMS 9-notebook canonical fixture the same way docs/runbooks/sync/apply.md does. Moving the plugin-model chapter to sigantry-hs2/docs/ would defeat the guide's purpose -- operators reading "what is the platform?" land at the repo root, not inside one customer's plugin tree. Same rationale category as CONSUMING.md + docs/CAPABILITIES.md.
