[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[project]
name = "sigantry"
description = "Governance, drift detection, and rollback engine for Microsoft Fabric CI/CD pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "JToye Digital", email = "bralabala@gmail.com" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Operating System :: OS Independent",
]
dependencies = [
    "azure-identity>=1.25.1,<2.0",
    "azure-keyvault-secrets>=4.10,<5.0",
    "azure-monitor-ingestion>=1.1,<2.0",
    "fabric-cicd>=1.0,<2.0",
    "httpx>=0.28,<0.29",
    "msal>=1.31,<2.0",
    "tenacity>=9.0,<10.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2,<3",
    "typer>=0.15,<1.0",
    "rich>=13.9,<16.0",
    "pyrate-limiter>=4.1,<5.0",
    "msfabricpysdkcore>=0.3.1,<0.4",
    "pynacl>=1.6,<2.0",
    "jinja2>=3.1,<4.0",
    "jsonschema>=4.20,<5.0",
]

[project.urls]
Homepage = "https://github.com/Bralabee/sigantry"
Documentation = "https://bralabee.github.io/sigantry"
Repository = "https://github.com/Bralabee/sigantry"
Issues = "https://github.com/Bralabee/sigantry/issues"
Changelog = "https://github.com/Bralabee/sigantry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-mock>=3.15,<4.0",
    "pytest-doctestplus>=1.3,<2.0",
    "respx>=0.21,<0.24",
    "ruff>=0.15,<0.17",
    "mypy>=1.19,<2.0",
    "types-PyYAML>=6.0,<7.0",
    "pre-commit>=4.5,<5.0",
    "build>=1.2,<2.0",
    "twine>=7.0,<8.0",
]
test = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-mock>=3.15,<4.0",
    "respx>=0.21,<0.24",
    "freezegun>=1.5,<2.0",
    "jsonschema>=4.20,<5.0",
    "build>=1.2,<2.0",
    "twine>=7.0,<8.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.7.6,<10.0",
    "mkdocstrings[python]>=0.26,<2.0",
]

[project.scripts]
diagnose-auth = "sigantry_core.auth.cli:app"
sigantry = "sigantry_core.cli:app"

# Entry-point groups for plugin discovery (11 protocol seams).
[project.entry-points."sigantry.deploy_profiles"]

[project.entry-points."sigantry.dq_gates"]

[project.entry-points."sigantry.telemetry_sinks"]

[project.entry-points."sigantry.auth_providers"]

[project.entry-points."sigantry.runbook_registries"]

[project.entry-points."sigantry.capacity_policies"]

[project.entry-points."sigantry.work_item_providers"]

[project.entry-points."sigantry.notification_sinks"]
teams = "sigantry_core.notifications.teams:TeamsNotificationSink"
slack = "sigantry_core.notifications.slack:SlackNotificationSink"
email = "sigantry_core.notifications.email:EmailNotificationSink"

[project.entry-points."sigantry.secret_stores"]
key_vault = "sigantry_core.secrets.key_vault:KeyVaultSecretStore"
github_secrets = "sigantry_core.secrets.github_secrets:GithubSecretsSecretStore"
ado_variable_group = "sigantry_core.secrets.ado_variable_group:AdoVariableGroupSecretStore"

[project.entry-points."sigantry.approval_gates"]
ado_environments = "sigantry_core.approval_gates.ado_environments:AdoEnvironmentsApprovalGate"
github_environments = "sigantry_core.approval_gates.github_environments:GithubEnvironmentsApprovalGate"
opa = "sigantry_core.approval_gates.opa_hook:OpaApprovalGate"

[project.entry-points."sigantry.pr_review_bots"]

[project.entry-points.pytest11]
sigantry_core = "sigantry_core.testing.fixtures"

[tool.hatch.version]
path = "sigantry_core/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["sigantry_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/sigantry_core",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/prereqs", "tests/sigantry_core", "tests/ci", "tests/contract", "tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers -m 'not integration and not smoke'"
markers = [
    "integration: tests that hit a real tenant (enable with PYTEST_RUN_INTEGRATION=1)",
    "slow: tests that exceed ~5s (wheel build, etc.) - run by default in CI, skip locally with -m 'not slow'",
    "smoke: tests that exercise the full smoke-deploy matrix against the test tenant (enable with PYTEST_RUN_SMOKE=1)",
    "contract: Contract tests - run each plugin implementation against its seam's contract fixture",
    "sigantry_ado: integration test gated on SIGANTRY_ADO_TEST_* env vars",
    "sigantry_github: integration test gated on SIGANTRY_GITHUB_TEST_* env vars",
    "sigantry_pipeline: integration test gated on SIGANTRY_FABRIC_TEST_* env vars",
    "sigantry_sync: integration test gated on SIGANTRY_FABRIC_TEST_* env vars",
    "sigantry_pr_bot: integration test gated on SIGANTRY_PR_BOT_* env vars",
    "sigantry_demo: integration test gated on SIGANTRY_DEMO_* env vars",
    "sigantry_seam: contract test for protocol seams",
    "sigantry_jtoye: integration test gated on SIGANTRY_JTOYE_* env vars",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Import sigantry_core.client instead of httpx directly. Allowed only inside sigantry_core/client/, sigantry_core/auth/diagnose.py, sigantry_core/auth/github_app.py, and sigantry_core/notifications/."

[tool.ruff.lint.isort]
known-first-party = ["sigantry_core"]

[tool.ruff.lint.per-file-ignores]
"sigantry_core/client/**" = ["TID251"]
"sigantry_core/auth/diagnose.py" = ["TID251"]
"sigantry_core/auth/github_app.py" = ["TID251"]
"sigantry_core/notifications/__init__.py" = ["TID251"]
"sigantry_core/notifications/teams.py" = ["TID251"]
"sigantry_core/notifications/slack.py" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/export-*.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/"]

[tool.coverage.run]
branch = true
source = ["sigantry_core"]
omit = [
    "sigantry_core/_version.py",
    "sigantry_core/pipelines/*",
    "sigantry_core/purview/*",
    "sigantry_core/utils/*",
    "sigantry_core/**/__init__.py",
    "sigantry_core/protocols.py",
    "sigantry_core/__main__.py",
    "sigantry_core/testing/fixtures.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
    "\\.\\.\\.$",
]
